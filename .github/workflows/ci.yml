name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-java:
    name: Java API — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test (Spring Boot + H2)
        working-directory: backend-java
        run: mvn -B -ntp test
      - name: Package jar
        working-directory: backend-java
        run: mvn -B -ntp -DskipTests package

  analytics-python:
    name: Python — проверка аналитики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r analytics-python/requirements-dev.txt
      - name: Compile check
        run: python -m py_compile analytics-python/app/*.py analytics-python/tests/*.py
      - name: Functional tests (no DB)
        run: python analytics-python/tests/test_compute.py
      - name: DB integration test (testcontainers + PostgreSQL)
        run: python analytics-python/tests/test_db_integration.py
      - name: Migration is up to date with seed.json
        run: |
          python scripts/gen_initsql.py
          git diff --exit-code backend-java/src/main/resources/db/migration/V1__initial_schema_and_seed.sql \
            || (echo "::error::V1 migration устарела — запустите: python scripts/gen_initsql.py" && exit 1)

  frontend-e2e:
    name: Frontend — e2e/регрессия (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install -r tests/frontend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run full frontend regression suite
        run: python tests/frontend/run_e2e.py

  e2e:
    name: Полный стек (docker compose)
    runs-on: ubuntu-latest
    env:
      AUTH_SEED_DEFAULTS: "true"   # demo users for the smoke test (admin/admin123)
    steps:
      - uses: actions/checkout@v7
      - name: Build & start stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          set -e
          ok=0
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health >/dev/null \
               && curl -fs http://localhost:8080/analytics/health >/dev/null; then
              ok=1; echo "services ready"; break
            fi
            echo "waiting ($i)…"; sleep 3
          done
          [ "$ok" = "1" ] || (echo "::error::services did not become ready" && exit 1)
      - name: Smoke test the whole stack via nginx
        run: |
          set -e
          # public endpoints
          curl -fs http://localhost:8080/api/health | grep -q '"status"'
          curl -fs http://localhost:8080/analytics/health | grep -q '"status"'
          curl -fs http://localhost:8080/ | grep -qi 'Планирование'
          # unauthenticated access to protected endpoints must be REJECTED (401)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/state)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/analytics/metrics)" = "401"
          # log in and use the bearer token
          TOKEN=$(curl -fs -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | grep -oE '"token":"[^"]+"' | cut -d'"' -f4)
          test -n "$TOKEN"
          AUTH="Authorization: Bearer $TOKEN"
          curl -fs -H "$AUTH" http://localhost:8080/api/state | grep -q '"version"'
          curl -fs -H "$AUTH" http://localhost:8080/analytics/metrics | grep -q 'avgVelocity'
          curl -fs -H "$AUTH" http://localhost:8080/analytics/rice | grep -q 'F-02'
          # security headers present
          curl -sI http://localhost:8080/ | grep -qi 'X-Frame-Options: DENY'
          curl -sI http://localhost:8080/ | grep -qi 'Content-Security-Policy'
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
