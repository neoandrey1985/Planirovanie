<title>Планирование спринтов — приложение</title>

:root{--bg:#EEF2F7;--panel:#FFF;--panel2:#F7F9FC;--ink:#16202E;--muted:#5A6B82;--line:#DCE3EC;
--accent:#2D5BE3;--accent-soft:#E4EBFB;--good:#1F9D6B;--warn:#C98A00;--crit:#D24545;
--good-bg:#E4F5EC;--warn-bg:#FBF1DA;--crit-bg:#FBE4E4;--shadow:0 1px 2px rgba(20,32,48,.06),0 8px 24px rgba(20,32,48,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0E141C;--panel:#172231;--panel2:#141E2B;--ink:#E6ECF5;--muted:#93A2B8;--line:#263547;
--accent:#5B84F0;--accent-soft:#1E2C44;--good:#35BB86;--warn:#E0A93B;--crit:#E9635F;--good-bg:#123024;--warn-bg:#332811;--crit-bg:#331C1C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="light"]{--bg:#EEF2F7;--panel:#FFF;--panel2:#F7F9FC;--ink:#16202E;--muted:#5A6B82;--line:#DCE3EC;--accent:#2D5BE3;--accent-soft:#E4EBFB;--good:#1F9D6B;--warn:#C98A00;--crit:#D24545;--good-bg:#E4F5EC;--warn-bg:#FBF1DA;--crit-bg:#FBE4E4}
:root[data-theme="dark"]{--bg:#0E141C;--panel:#172231;--panel2:#141E2B;--ink:#E6ECF5;--muted:#93A2B8;--line:#263547;--accent:#5B84F0;--accent-soft:#1E2C44;--good:#35BB86;--warn:#E0A93B;--crit:#E9635F;--good-bg:#123024;--warn-bg:#332811;--crit-bg:#331C1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.5}
.tnum{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:14px;height:56px;padding:0 18px}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.tabs button{background:none;border:none;color:var(--muted);padding:8px 11px;border-radius:8px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tabs button:hover{color:var(--ink);background:var(--panel)}
.tabs button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tools{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.92;color:#fff}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
main{max-width:1240px;margin:0 auto;padding:20px 18px 60px}
.view{display:none}.view.active{display:block}
h1{font-size:23px;margin:4px 0 4px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.s-good{background:var(--good)}.s-warn{background:var(--warn)}.s-crit{background:var(--crit)}.s-neut{background:var(--accent)}
.kpi .k-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .k-val{font-size:27px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.kpi .k-val small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .k-note{font-size:12px;color:var(--muted);margin-top:3px}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:880px){.cols.two{grid-template-columns:1fr 1fr}}
.ctitle{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
svg{width:100%;height:auto;display:block}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tbar .sp{flex:1}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td input,td select{width:100%;min-width:70px;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:13.5px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);outline:none;background:var(--panel2)}
td.num input{text-align:right;font-variant-numeric:tabular-nums}
td.wide input{min-width:220px}
.rowdel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.rowdel:hover{color:var(--crit);background:var(--crit-bg)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-good{color:var(--good);background:var(--good-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-crit{color:var(--crit);background:var(--crit-bg)}.p-neut{color:var(--accent);background:var(--accent-soft)}
.matrix{border-collapse:separate;border-spacing:3px;width:auto}
.matrix td{border:none;border-radius:6px;text-align:center;font-weight:700;width:42px;height:34px;color:#20130f}
.matrix th{text-align:center;color:var(--muted);background:none;position:static}
.mx-g{background:#C6EFCE}.mx-y{background:#FFEB9C}.mx-r{background:#FFC7CE}
.param-grid{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;max-width:640px}
.param-grid label{color:var(--muted);font-size:13.5px}
.param-grid input,.param-grid select,.param-grid textarea{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:100%}
.dodlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dodlist label{display:flex;gap:9px;align-items:center;color:var(--ink);font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:.95}
button:focus-visible,input:focus-visible,select:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>

 <div class="brand"><span class="dot"></span>Планирование&nbsp;спринтов</div>

 </div>
</div></header>

function cpm(tasks){const dur={},pred={},ids=tasks.map(t=>t.id),idset=new Set(ids);
 tasks.forEach(t=>{dur[t.id]=num(t.est);const dp=(t.dep&&String(t.dep).trim());pred[t.id]=(dp&&dp!==t.id&&idset.has(dp))?[dp]:[];});
 const EF={},ES={};ids.forEach(i=>{EF[i]=0;ES[i]=0;});
 for(let k=0;k<ids.length+2;k++)ids.forEach(i=>{const ps=pred[i];ES[i]=ps.length?Math.max.apply(null,ps.map(p=>EF[p])):0;EF[i]=ES[i]+dur[i];});
 const proj=ids.length?Math.max.apply(null,ids.map(i=>EF[i])):0;const succ={};ids.forEach(i=>succ[i]=[]);ids.forEach(i=>pred[i].forEach(p=>succ[p].push(i)));

/* ---------- date + compute engine ---------- */
const MS=86400000;
function pd(s){return s?new Date(s+'T00:00:00Z'):null;}

function addD(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x;}
function fmtd(d){return d?('0'+d.getUTCDate()).slice(-2)+'.'+('0'+(d.getUTCMonth()+1)).slice(-2)+'.'+d.getUTCFullYear():'';}

function compute(){
 const P=ST.params, start=pd(P.start)||pd('2026-08-03'), today=pd(P.today)||new Date(), N=P.sprints||11;
 const focus=num(P.focus)||0.8, holidays=(ST.calendar||[]).map(h=>typeof h==='string'?h:h.date);
 const sp=[];
 for(let s=1;s<=N;s++){const a=addD(start,(s-1)*14),b=addD(start,(s-1)*14+11);
  const wd=netdays(a,b,holidays);
  const cap=(ST.team||[]).reduce((t,m)=>t+(wd-(num(m.absent)))*num(m.avail)*focus,0);
  const plan=(ST.tasks||[]).filter(t=>+t.sprint===s).reduce((x,t)=>x+num(t.est),0);
  let status= today>b?'Закрыт': today>=a?'Активный':'Планируется';
  const vel= status==='Закрыт'? (ST.tasks||[]).filter(t=>+t.sprint===s&&t.status==='Готово').reduce((x,t)=>x+num(t.est),0):null;
  sp.push({s,a,b,wd,cap:Math.round(cap*10)/10,plan,vel,status,pct:(plan&&vel!=null)?vel/plan:null});
 }
 const started=sp.filter(x=>today>=x.a).length; const cur=Math.max(1,Math.min(N,started));
 const closed=sp.filter(x=>x.status==='Закрыт');
 const vels=closed.map(x=>x.vel).filter(v=>v!=null&&v>0);
 const avgVel=vels.length?vels.reduce((a,b)=>a+b,0)/vels.length:0;
 const curSp=sp[cur-1]||sp[0];
 const dod=ST.dod||[]; const dodPct=dod.length?dod.filter(d=>d.done).length/dod.length:0;
 // releases content + date

 // TTM
 const ttm=[];(ST.tasks||[]).forEach(t=>{const r=(ST.releases||[]).find(r=>+r.sfrom<=+t.sprint&&+r.sto>=+t.sprint);
   if(r&&t.started){const rd=relDate(r);if(rd){ttm.push({task:t.id,ttm:Math.round((rd-pd(t.started))/MS)});}else ttm.push({task:t.id,ttm:null});}else ttm.push({task:t.id,ttm:null});});
 const ttmv=ttm.map(x=>x.ttm).filter(v=>v!=null); const ttmAvg=ttmv.length?ttmv.reduce((a,b)=>a+b,0)/ttmv.length:0;

 const bugsBy=[];for(let s=1;s<=N;s++){const bb=(ST.bugs||[]).filter(b=>+b.sprint===s);bugsBy.push({s,total:bb.length,closed:bb.filter(b=>b.status==='Закрыт').length});}

 sp.forEach(x=>{x.cost=Math.round(x.cap*rate);cum+=x.cost;x.cum=cum;});

 const qOf=d=>'Q'+(Math.floor(d.getUTCMonth()/3)+1)+' '+d.getUTCFullYear();
 const qmap={},qord=[];sp.forEach(x=>{const q=qOf(x.a);if(!qmap[q]){qmap[q]={q,n:0,cap:0,plan:0,vel:0,hasVel:false};qord.push(q);}

function drawQRoadmap(box,C){const sp=C.sp;if(!sp.length){box.textContent='';return;}
 const t0=sp[0].a,t1=sp[sp.length-1].b,span=Math.max(1,(t1-t0)/MS);

 const qcol={};let qi=0;sp.forEach(x=>{const q=C.qOf(x.a);if(!(q in qcol)){qcol[q]=pal[qi%pal.length];qi++;}});
 const seen={};
 sp.forEach((x,i)=>{const q=C.qOf(x.a);
   const xa=ml+(W-ml-mr)*((x.a-t0)/MS)/span,xb=ml+(W-ml-mr)*((x.b-t0)/MS)/span,y=mt+i*rowH+3;
   const lbl=el('text',{x:6,y:y+11,'font-size':10,fill:col('--ink')});lbl.textContent='Спринт '+x.s;svg.appendChild(lbl);
   const r=el('rect',{x:xa,y,width:Math.max(3,xb-xa),height:rowH-8,rx:3,fill:qcol[q]});
   const tt=el('title');tt.textContent=`Спринт ${x.s} · ${q} · ${fmtd(x.a)}–${fmtd(x.b)}`;r.appendChild(tt);svg.appendChild(r);
   if(!seen[q]){seen[q]=1;const qx=el('text',{x:xa,y:mt-10,'font-size':10,'font-weight':600,fill:qcol[q]});qx.textContent=q;svg.appendChild(qx);
     svg.appendChild(el('line',{x1:xa,y1:mt-7,x2:xa,y2:H-10,stroke:qcol[q],'stroke-dasharray':'3 3','stroke-opacity':.5}));}});

function renderAnalytics(C){const v=document.getElementById('v_analytics');const sp=C.sp,tasks=ST.tasks||[];
 v.innerHTML=`<h1>Аналитика</h1><p class="lede">Сводные графики и метрики из «Бэклога», «Команды» и «Багов»: сгорание, поток, cycle time, распределение, загрузка, прогноз, качество.</p>
  <div class="grid kpis" id="an_kpi"></div>
  <div class="grid2">
   <div class="card"><p class="ctitle">Сгорание (burndown)</p><div id="an_bd"></div><div class="legend"><span><i style="background:var(--crit)"></i>Осталось</span><span><i style="background:var(--muted)"></i>Идеал</span></div></div>
   <div class="card"><p class="ctitle">Burn-up — сделано vs scope</p><div id="an_bu"></div><div class="legend"><span><i style="background:var(--good)"></i>Сделано</span><span><i style="background:var(--accent)"></i>Scope</span></div></div>
   <div class="card"><p class="ctitle">Поток задач по спринтам (CFD)</p><div id="an_cfd"></div><div class="legend"><span><i style="background:var(--accent)"></i>To Do</span><span><i style="background:var(--warn)"></i>В работе</span><span><i style="background:var(--good)"></i>Готово</span></div></div>
   <div class="card"><p class="ctitle">Cycle time по задачам (дн)</p><div id="an_ct"></div><div class="legend"><span><i style="background:var(--accent)"></i>Cycle time</span><span><i style="background:var(--crit)"></i>среднее</span></div></div>
   <div class="card"><p class="ctitle">Распределение объёма по типам (дн)</p><div id="an_dt"></div></div>
   <div class="card"><p class="ctitle">Распределение объёма по ролям (дн)</p><div id="an_dr"></div></div>
   <div class="card"><p class="ctitle">Загрузка по ролям · спринт С${C.cur}</p><div id="an_rl"></div><div class="legend"><span><i style="background:var(--accent)"></i>Ёмкость</span><span><i style="background:var(--warn)"></i>Спрос</span></div></div>
   <div class="card"><p class="ctitle">Ёмкость vs спрос по кварталам (дн)</p><div id="an_cap"></div><div class="legend"><span><i style="background:var(--accent)"></i>Ёмкость</span><span><i style="background:var(--warn)"></i>Спрос</span></div></div>
   <div class="card"><p class="ctitle">Дефекты по серьёзности</p><div id="an_sev"></div></div>
  </div>`;
 // predictability / throughput / forecast
 const vels=C.vels||[];const mean=vels.length?vels.reduce((a,b)=>a+b,0)/vels.length:0;
 const sd=vels.length>1?Math.sqrt(vels.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(vels.length-1)):0;const cv=mean?sd/mean:0;
 const doneTasks=tasks.filter(t=>t.status==='Готово').length;const thr=C.closed?doneTasks/C.closed:0;
 const fc=C.avgVel?C.remain/C.avgVel:null;
 const vmin=vels.length?Math.min.apply(null,vels):0,vmax=vels.length?Math.max.apply(null,vels):0;
 const fcOpt=vmax?C.remain/vmax:null,fcPes=vmin?C.remain/vmin:null;
 document.getElementById('an_kpi').innerHTML=[
  kpiCard('Предсказуемость',pctf(1-Math.min(1,cv)),'CV velocity '+pctf(cv),cv<=.2?'good':cv<=.35?'warn':'crit'),
  kpiCard('Throughput',fmt(thr,1)+' <small>зад/спр</small>','закрыто спринтов '+C.closed,'neut'),
  kpiCard('Прогноз (Монте-Карло)',fc==null?'—':fmt(fc,1)+' <small>спр</small>','остаток '+fmt(C.remain,0)+' дн','neut'),
  kpiCard('Диапазон прогноза',(fcOpt==null?'—':fmt(fcOpt,1))+'–'+(fcPes==null?'—':fmt(fcPes,1))+' <small>спр</small>','оптим.–пессим.','neut'),
  kpiCard('DRE',pctf(C.dre),'выявление дефектов',C.dre>=.8?'good':C.dre>=.6?'warn':'crit')
 ].join('');
 // burndown / burn-up
 const scope=tasks.reduce((a,t)=>a+num(t.est),0);
 const cats=['С0'].concat(sp.map(x=>'С'+x.s));
 let cum=0;const doneCum=[0],rem=[scope];let stop=false;
 sp.forEach(x=>{if(x.vel==null||stop){stop=true;doneCum.push(null);rem.push(null);}else{cum+=x.vel;doneCum.push(cum);rem.push(Math.max(0,scope-cum));}});
 const ideal=cats.map((c,i)=>scope*(1-i/(cats.length-1)));
 lines(document.getElementById('an_bd'),cats,[{color:col('--crit'),data:rem,w:3},{color:col('--muted'),data:ideal,dash:true,noPts:true}]);
 lines(document.getElementById('an_bu'),cats,[{color:col('--good'),data:doneCum,w:3},{color:col('--accent'),data:cats.map(()=>scope),dash:true,noPts:true}]);
 // CFD grouped bars per sprint by status
 const N=sp.length,todo=[],prog=[],done=[];
 for(let s=1;s<=N;s++){const ts=tasks.filter(t=>+t.sprint===s);todo.push(ts.filter(t=>t.status==='To Do').length);prog.push(ts.filter(t=>t.status==='В работе').length);done.push(ts.filter(t=>t.status==='Готово').length);}
 bars(document.getElementById('an_cfd'),sp.map(x=>'С'+x.s),[{color:col('--accent'),data:todo},{color:col('--warn'),data:prog},{color:col('--good'),data:done}]);
 // cycle time
 const ctv=tasks.filter(t=>t.started&&t.done).map(t=>({id:t.id,d:Math.max(0,Math.round((pd(t.done)-pd(t.started))/MS))}));
 const ctAvg=ctv.length?ctv.reduce((a,b)=>a+b.d,0)/ctv.length:0;
 if(ctv.length)lines(document.getElementById('an_ct'),ctv.map(x=>x.id),[{color:col('--accent'),data:ctv.map(x=>x.d),w:2}],{target:ctAvg});
 else document.getElementById('an_ct').innerHTML='<p style="color:var(--muted);font-size:13px">Нет задач с датами «в работу» и «готово».</p>';
 // distribution by type / role
 const byType={};tasks.forEach(t=>{const k=t.type||'Задача';byType[k]=(byType[k]||0)+num(t.est);});
 bars(document.getElementById('an_dt'),Object.keys(byType),[{color:col('--accent'),data:Object.values(byType)}]);
 const byRole={};tasks.forEach(t=>{const k=t.role||'—';byRole[k]=(byRole[k]||0)+num(t.est);});
 bars(document.getElementById('an_dr'),Object.keys(byRole),[{color:col('--good'),data:Object.values(byRole)}]);
 // role load current sprint: capacity vs demand
 const cs=sp[C.cur-1]||sp[0],focus=num(ST.params.focus)||0.8;
 const capRole={},demRole={};ROLES.forEach(r=>{capRole[r]=0;demRole[r]=0;});
 (ST.team||[]).forEach(m=>{if(capRole[m.role]!=null)capRole[m.role]+=Math.max(0,(cs.wd-num(m.absent)))*num(m.avail)*focus;});
 tasks.filter(t=>+t.sprint===C.cur).forEach(t=>{if(demRole[t.role]!=null)demRole[t.role]+=num(t.est);});
 bars(document.getElementById('an_rl'),ROLES,[{color:col('--accent'),data:ROLES.map(r=>Math.round(capRole[r]*10)/10)},{color:col('--warn'),data:ROLES.map(r=>demRole[r])}]);
 // capacity vs demand by quarter
 bars(document.getElementById('an_cap'),C.quarters.map(q=>q.q),[{color:col('--accent'),data:C.quarters.map(q=>q.cap)},{color:col('--warn'),data:C.quarters.map(q=>q.plan)}]);
 // bugs by severity
 const sev={Critical:0,Major:0,Minor:0};(ST.bugs||[]).forEach(b=>{if(sev[b.sev]!=null)sev[b.sev]++;});
 bars(document.getElementById('an_sev'),Object.keys(sev),[{color:col('--crit'),data:Object.values(sev)}]);
}
/* ---------- Excel export (pure JS zip + OOXML) ---------- */
const _crc=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crc[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function te(s){return new TextEncoder().encode(s);}
function zipStore(files){let parts=[],cd=[],off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
 files.forEach(f=>{const nb=te(f.name),crc=crc32(f.data),sz=f.data.length;
  const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nb.length),u16(0));
  parts.push(new Uint8Array(lh),nb,f.data);cd.push({name:nb,crc,sz,off});off+=lh.length+nb.length+sz;});
 const cdStart=off;let cdArr=[];cd.forEach(e=>{const hh=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(e.crc),u32(e.sz),u32(e.sz),u16(e.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.off));cdArr.push(new Uint8Array(hh),e.name);off+=hh.length+e.name.length;});
 const cdSize=off-cdStart;const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(cd.length),u16(cd.length),u32(cdSize),u32(cdStart),u16(0)));
 const all=parts.concat(cdArr,[eocd]);let total=all.reduce((a,b)=>a+b.length,0),out=new Uint8Array(total),p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;}
function xesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function colL(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function sheetXml(aoa){let rows='';aoa.forEach((row,ri)=>{let cells='';row.forEach((val,ci)=>{const ref=colL(ci)+(ri+1);
  if(typeof val==='number'&&isFinite(val))cells+=`<c r="${ref}"><v>${val}</v></c>`;
  else cells+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;});rows+=`<row r="${ri+1}">${cells}</row>`;});
 return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows+'</sheetData></worksheet>';}
function sname(n){return String(n).replace(/[\[\]\*\/\\\?:]/g,' ').slice(0,31);}
function buildXlsx(sheets){const files=[];
 files.push({name:'[Content_Types].xml',data:te('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>')});
 files.push({name:'_rels/.rels',data:te('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
 files.push({name:'xl/workbook.xml',data:te('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${xesc(sname(s.name))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>')});
 files.push({name:'xl/_rels/workbook.xml.rels',data:te('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>')});
 sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:te(sheetXml(s.aoa))}));
 return zipStore(files);}
function exportXlsx(){const C=compute();const s=[];
 s.push({name:'Дашборд',aoa:[['Показатель','Значение'],['Цель',ST.params.goal||''],['Текущий спринт',C.cur],['Ср. velocity',C.avgVel],['Health-index',C.health],['TTM средний',C.ttmAvg],['Открыто багов',C.bugsOpen],['DRE',C.dre]]});
 s.push({name:'Дорожная карта',aoa:[['Спринт','Начало','Конец','Раб.дни','Ёмкость','План','Velocity','% вып','Статус']].concat(C.sp.map(x=>['С'+x.s,fmtd(x.a),fmtd(x.b),x.wd,x.cap,x.plan,x.vel==null?'':x.vel,x.pct==null?'':x.pct,x.status]))});
 s.push({name:'Бэклог',aoa:[['ID','Задача','Исполнитель','Роль','Тип','Оценка','Статус','Спринт','Зависит','В работу','Готово']].concat((ST.tasks||[]).map(t=>[t.id,t.title,t.assignee,t.role,t.type,num(t.est),t.status,num(t.sprint),t.dep,t.started,t.done]))});
 s.push({name:'Команда',aoa:[['Участник','Роль','Доступность','Отсутствия']].concat((ST.team||[]).map(m=>[m.name,m.role,num(m.avail),num(m.absent)]))});
 s.push({name:'Релизы',aoa:[['ID','Релиз','Спр.от','Спр.до','Статус']].concat((ST.releases||[]).map(r=>[r.id,r.name,num(r.sfrom),num(r.sto),r.status]))});
 s.push({name:'Вехи',aoa:[['ID','Веха','Спринт','Статус','Релиз']].concat((ST.milestones||[]).map(v=>[v.id,v.name,num(v.sprint),v.status,v.rel]))});
 s.push({name:'Техдолг',aoa:[['ID','Описание','Область','Тип','Влияние','Оценка','Статус','Создан','Погашен']].concat((ST.techDebt||[]).map(t=>[t.id,t.desc,t.area,t.type,t.impact,num(t.est),t.status,num(t.created),t.paid==null?'':num(t.paid)]))});
 s.push({name:'OKR',aoa:[['Квартал','Objective','Key Result','Цель','Текущее','Прогресс']].concat((ST.okr||[]).map(o=>[o.q,o.obj,o.kr,num(o.target),num(o.cur),num(o.target)?num(o.cur)/num(o.target):0]))});
 s.push({name:'Бюджет',aoa:[['Спринт','Ёмкость','Стоимость','Накопл.']].concat(C.sp.map(x=>['С'+x.s,x.cap,x.cost,x.cum]))});
 s.push({name:'Риски',aoa:[['Риск','Вероятн','Влияние','Балл','Митигация','Владелец','Статус']].concat((ST.risks||[]).map(r=>[r.name,num(r.p),num(r.i),num(r.p)*num(r.i),r.mit,r.owner,r.status]))});
 s.push({name:'Баги',aoa:[['ID','Описание','Задача','Спринт','Серьёзность','Статус','Причина']].concat((ST.bugs||[]).map(b=>[b.id,b.desc,b.task,num(b.sprint),b.sev,b.status,b.cause]))});
 s.push({name:'Кварталы',aoa:[['Квартал','Спринтов','Ёмкость','План','Velocity','Загрузка','% вып','Вехи/эпики']].concat((C.quarters||[]).map(q=>[q.q,q.n,q.cap,q.plan,q.hasVel?q.vel:'',q.load,q.pct==null?'':q.pct,q.epics]))});
 s.push({name:'Ретроспективы',aoa:[['Спринт','Что хорошо','Что улучшить','Action item','Ответственный','Срок','Статус']].concat((ST.retro||[]).map(r=>[num(r.sprint),r.well,r.improve,r.action,r.owner,r.due,r.status]))});
 s.push({name:'Календарь',aoa:[['Дата','Праздник / выходной']].concat((ST.calendar||[]).map(h=>[typeof h==='string'?h:h.date,typeof h==='string'?'':h.name]))});
 const bin=buildXlsx(s);const blob=new Blob([bin],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Планирование_спринта.xlsx';document.body.appendChild(a);a.click();a.remove();toast('Excel экспортирован');}

/* ---------- app plumbing ---------- */
let CURV='dash';
function commit(){save();views();activate(CURV);toast('Сохранено');}
function recomputeSoft(){/* light: refresh dashboard only, keep edit focus */ renderDash(compute());}
function activate(id){CURV=id;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));
 document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v_'+id));window.scrollTo(0,0);}
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.dataset.v){activate(e.target.dataset.v);}});
document.getElementById('xls').onclick=exportXlsx;
document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='planirovanie_data.json';a.click();toast('Экспортировано');};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{ST=JSON.parse(r.result);save();views();activate(CURV);toast('Импортировано');}catch(err){toast('Ошибка файла');}};r.readAsText(f);};
document.getElementById('rst').onclick=()=>{if(confirm('Сбросить все данные к исходным?')){ST=JSON.parse(JSON.stringify(SEED));save();views();activate(CURV);toast('Сброшено');}};
document.getElementById('themebtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const sys=matchMedia('(prefers-color-scheme:dark)').matches;const nx=(cur||(sys?'dark':'light'))==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);views();activate(CURV);};
views();activate('dash');

/* ---------- multi-user sync (shared backend) ---------- */
const API='api/state';
let SYNC={on:false,ver:0,editAt:0,tk:localStorage.getItem('team_tk')||''};
function hdrs(json){const h={};if(json)h['Content-Type']='application/json';if(SYNC.tk)h['x-team-token']=SYNC.tk;return h;}
function setSt(txt,cls){const e=document.getElementById('syncst');if(e){e.textContent=txt;e.className='pill '+cls;}}
function askToken(){const t=prompt('Введите ключ команды для доступа к общей базе:');if(t){SYNC.tk=t.trim();localStorage.setItem('team_tk',SYNC.tk);syncPull(true);}else{setSt('🔒 нужен ключ','p-warn');}}
async function syncPull(initial){
 try{const r=await fetch(API,{headers:hdrs(false),cache:'no-store'});
  if(r.status===401){SYNC.on=false;askToken();return;}
  if(!r.ok)throw 0;const d=await r.json();SYNC.on=true;
  const busy=(!initial)&&(Date.now()-SYNC.editAt<4000);
  if((initial||d.version>SYNC.ver)&&!busy){
    ST=migrate(d.state||JSON.parse(JSON.stringify(SEED)));SYNC.ver=d.version;
    localStorage.setItem('sprintapp',JSON.stringify(ST));views();activate(CURV);
    if(!initial)toast('Обновлено (другой пользователь)');
  } else if(d.version>SYNC.ver){SYNC.ver=SYNC.ver;/* keep, will resync after edits settle */}
  setSt('🟢 онлайн','p-good');
 }catch(e){SYNC.on=false;setSt('⚪ офлайн','p-neut');}
}
let pushT=null;
function syncSchedule(){SYNC.editAt=Date.now();if(!SYNC.on)return;clearTimeout(pushT);pushT=setTimeout(syncPush,700);}
async function syncPush(){
 try{const r=await fetch(API,{method:'PUT',headers:hdrs(true),body:JSON.stringify({state:ST})});
  if(r.status===401){SYNC.on=false;askToken();return;}
  if(!r.ok)throw 0;const d=await r.json();SYNC.ver=d.version;SYNC.on=true;setSt('🟢 сохранено','p-good');
 }catch(e){SYNC.on=false;setSt('⚪ офлайн','p-neut');}
}
function startSync(){
 fetch(API,{method:'HEAD'}).then(r=>{ // probe: backend present?
  if(!r.ok&&r.status!==401&&r.status!==405){setSt('⚪ локально','p-neut');return;}
  syncPull(true);setInterval(()=>syncPull(false),5000);
 }).catch(()=>{setSt('⚪ локально','p-neut');});
}
startSync();
</script>
