<svg width="2160" height="1215" viewBox="0 0 2160 1215" xmlns="http://www.w3.org/2000/svg">
 <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5A6B82"/></marker>
 <style>.lbl{font-size:30px;font-weight:700;fill:#16202E}.sub{font-size:21px;fill:#5A6B82}.edge{stroke:#5A6B82;stroke-width:2.5;fill:none;marker-end:url(#ar)}.el{font-size:19px;fill:#5A6B82}.port{font-size:20px;font-weight:700;fill:#1F9D6B}</style></defs>
 <text x="80" y="76" font-size="46" font-weight="700" fill="#16202E">Архитектура микросервисов (docker-compose)</text>
 <text x="80" y="118" font-size="25" fill="#5A6B82">Четыре сервиса в одной внутренней сети; наружу открыт только порт 8080 (web/nginx).</text>

 <!-- External browser -->
 <rect x="80" y="180" width="360" height="86" rx="14" fill="#E4EBFB" stroke="#2D5BE3" stroke-width="2"/>
 <text x="110" y="222" class="lbl">🌐 Браузер</text><text x="110" y="252" class="sub">пользователь</text>

 <!-- docker network boundary -->
 <rect x="80" y="310" width="2000" height="720" rx="22" fill="none" stroke="#9AA7B8" stroke-width="2.5" stroke-dasharray="3 9"/>
 <text x="104" y="348" font-size="22" font-weight="700" fill="#5A6B82">docker-compose · внутренняя сеть</text>

 <!-- web / nginx -->
 <rect x="130" y="390" width="520" height="250" rx="16" fill="#F2F5FA" stroke="#2D5BE3" stroke-width="2.5"/>
 <text x="160" y="442" class="lbl">web · nginx</text>
 <text x="160" y="480" class="port">порт 8080:80 (единственный публичный)</text>
 <text x="160" y="516" class="sub">раздаёт SPA (index.html) и /docs</text>
 <text x="160" y="548" class="sub">reverse-proxy: /api, /analytics, /ws/board</text>
 <text x="160" y="580" class="sub">образ: ./frontend</text>
 <text x="160" y="612" class="sub">depends_on: api, analytics</text>

 <!-- api -->
 <rect x="720" y="390" width="560" height="250" rx="16" fill="#EAF6F0" stroke="#1F9D6B" stroke-width="2.5"/>
 <text x="750" y="442" class="lbl">api · Java / Spring Boot</text>
 <text x="750" y="480" class="sub">REST /api/state (оптим. блокировка)</text>
 <text x="750" y="512" class="sub">авторизация (сессии), роли, аудит</text>
 <text x="750" y="544" class="sub">Flyway V1–V10 (JPA_DDL_AUTO=none)</text>
 <text x="750" y="576" class="sub">WebSocket /ws/board; интеграции</text>
 <text x="750" y="612" class="sub">внутренний порт · depends_on: db (healthy)</text>

 <!-- analytics -->
 <rect x="1350" y="390" width="560" height="250" rx="16" fill="#FBF3E0" stroke="#C98A00" stroke-width="2.5"/>
 <text x="1380" y="442" class="lbl">analytics · Python / FastAPI</text>
 <text x="1380" y="480" class="sub">движок метрик /analytics</text>
 <text x="1380" y="512" class="sub">velocity, прогноз, Монте-Карло</text>
 <text x="1380" y="544" class="sub">bearer-токен (как у api)</text>
 <text x="1380" y="576" class="sub">read-only доступ к БД</text>
 <text x="1380" y="612" class="sub">внутренний порт · depends_on: db</text>

 <!-- db -->
 <rect x="720" y="760" width="560" height="210" rx="16" fill="#EAF6F0" stroke="#1F9D6B" stroke-width="2.5"/>
 <text x="750" y="812" class="lbl">db · PostgreSQL 16</text>
 <text x="750" y="850" class="sub">БД planirovanie (данные) + журнал/аудит</text>
 <text x="750" y="882" class="sub">том pgdata (persistent volume)</text>
 <text x="750" y="914" class="sub">healthcheck pg_isready</text>
 <text x="750" y="946" class="sub">без публичного порта</text>

 <!-- external integrations -->
 <rect x="1350" y="760" width="560" height="210" rx="16" fill="#FBF3E0" stroke="#C98A00" stroke-width="2"/>
 <text x="1380" y="812" class="lbl">🔌 Внешние сервисы</text>
 <text x="1380" y="850" class="sub">Atlassian: Jira, Confluence, Opsgenie,</text>
 <text x="1380" y="882" class="sub">Bitbucket, Trello, JSM, Bamboo, Statuspage</text>
 <text x="1380" y="914" class="sub">Slack (исходящие)</text>
 <text x="1380" y="946" class="sub">вне сети · HTTPS, только исходящие</text>

 <!-- edges -->
 <path class="edge" d="M260,266 L350,390"/><text x="150" y="300" class="el">HTTP :8080</text>
 <path class="edge" d="M650,500 L720,500"/><text x="650" y="490" class="el">/api, /ws</text>
 <path class="edge" d="M650,560 C690,600 1330,470 1350,490"/><text x="1000" y="540" class="el">/analytics</text>
 <path class="edge" d="M1000,640 L1000,760"/><text x="1010" y="710" class="el">JDBC</text>
 <path class="edge" d="M1500,640 C1420,700 1300,740 1280,820"/><text x="1310" y="700" class="el">read</text>
 <path class="edge" d="M1280,560 C1330,620 1500,680 1520,760"/><text x="1300" y="620" class="el">REST/webhook</text>

 <rect x="80" y="1060" width="2000" height="110" rx="16" fill="#F2F5FA" stroke="#DCE3EC" stroke-width="2"/>
 <text x="1080" y="1104" text-anchor="middle" font-size="25" font-weight="700" fill="#16202E">Запуск: make up → docker compose up (db → api → analytics → web)</text>
 <text x="1080" y="1140" text-anchor="middle" font-size="22" fill="#5A6B82">Безопасность: наружу только :8080; БД и сервисы api/analytics доступны лишь внутри сети; секреты — через переменные окружения</text>
</svg>