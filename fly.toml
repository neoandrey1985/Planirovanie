# Деплой на Fly.io (https://fly.io) с постоянным томом (бесплатный тариф это позволяет).
# Установите flyctl, затем:
#   fly launch --no-deploy --copy-config      # создаст приложение по этому файлу
#   fly volumes create data --size 1          # том для БД
#   fly secrets set TEAM_TOKEN=ваш_ключ       # общий ключ команды (необязательно)
#   fly deploy
app = "planirovanie"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/data.db"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
