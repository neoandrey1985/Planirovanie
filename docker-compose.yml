services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: planirovanie
      POSTGRES_USER: planirovanie
      # DB is only reachable on the internal docker network (no published port).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-planirovanie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Schema + seed are applied by Flyway from the Java service on startup (not by Postgres init).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planirovanie -d planirovanie"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/planirovanie
      DB_USER: planirovanie
      DB_PASSWORD: ${DB_PASSWORD:-planirovanie}
      JPA_DDL_AUTO: none
      # Security: no weak demo users by default. On a fresh DB an "admin" is created with
      # APP_ADMIN_PASSWORD (or a random password printed in `docker compose logs api`).
      # Set AUTH_SEED_DEFAULTS=true ONLY for a throwaway local demo.
      AUTH_SEED_DEFAULTS: ${AUTH_SEED_DEFAULTS:-false}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-*}
      APP_WS_ALLOWED_ORIGINS: ${APP_WS_ALLOWED_ORIGINS:-*}
      # Integrations (all optional; off until set). Slack + full Atlassian product suite.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JSM_SERVICE_DESK_ID: ${JSM_SERVICE_DESK_ID:-}
      JSM_REQUEST_TYPE_ID: ${JSM_REQUEST_TYPE_ID:-}
      JPD_PROJECT_KEY: ${JPD_PROJECT_KEY:-}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_SPACE_KEY: ${CONFLUENCE_SPACE_KEY:-}
      COMPASS_CLOUD_ID: ${COMPASS_CLOUD_ID:-}
      BITBUCKET_WORKSPACE: ${BITBUCKET_WORKSPACE:-}
      BITBUCKET_USER: ${BITBUCKET_USER:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_REPO: ${BITBUCKET_REPO:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_LIST_ID: ${TRELLO_LIST_ID:-}
      OPSGENIE_API_KEY: ${OPSGENIE_API_KEY:-}
      STATUSPAGE_API_KEY: ${STATUSPAGE_API_KEY:-}
      STATUSPAGE_PAGE_ID: ${STATUSPAGE_PAGE_ID:-}
      BAMBOO_BASE_URL: ${BAMBOO_BASE_URL:-}
      BAMBOO_TOKEN: ${BAMBOO_TOKEN:-}
      BAMBOO_PLAN_KEY: ${BAMBOO_PLAN_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # No published port: the Java API is reached only through nginx (web) on the internal network.

  analytics:
    build: ./analytics-python
    environment:
      DB_URL_PY: postgresql+psycopg2://planirovanie:${DB_PASSWORD:-planirovanie}@db:5432/planirovanie
      # Analytics data endpoints require the same bearer session token as the Java API.
      ANALYTICS_AUTH_ENABLED: ${ANALYTICS_AUTH_ENABLED:-true}
      ANALYTICS_CORS_ORIGINS: ${APP_ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    # No published port: analytics is reached only through nginx (web) on the internal network.

  web:
    build: ./frontend
    depends_on:
      - api
      - analytics
    ports:
      - "8080:80"     # the only publicly exposed port — open http://localhost:8080

volumes:
  pgdata:
