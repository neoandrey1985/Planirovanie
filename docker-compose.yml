services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: planirovanie
      POSTGRES_USER: planirovanie
      POSTGRES_PASSWORD: planirovanie
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planirovanie -d planirovanie"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/planirovanie
      DB_USER: planirovanie
      DB_PASSWORD: planirovanie
      TEAM_TOKEN: ${TEAM_TOKEN:-}
      JPA_DDL_AUTO: none
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"   # direct access to the Java API (optional)

  analytics:
    build: ./analytics-python
    environment:
      DB_URL_PY: postgresql+psycopg2://planirovanie:planirovanie@db:5432/planirovanie
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # direct access to the Python analytics API (optional)

  web:
    build: ./frontend
    depends_on:
      - api
      - analytics
    ports:
      - "8080:80"     # open http://localhost:8080

volumes:
  pgdata:
