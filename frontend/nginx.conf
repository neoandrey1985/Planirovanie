server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Java REST API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Python analytics service
    location /analytics/ {
        proxy_pass http://analytics:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
