server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (defense-in-depth) ----
    add_header X-Frame-Options "DENY" always;                     # clickjacking
    add_header X-Content-Type-Options "nosniff" always;           # MIME sniffing
    add_header Referrer-Policy "no-referrer" always;              # don't leak URLs (WS ?token=)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enforced only once TLS terminates in front of this proxy (ignored over plain http):
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: single inline-script SPA + CDN libs (pptxgenjs/jsPDF); blocks framing and plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Java REST API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Live collaboration WebSocket (whiteboard)
    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Python analytics service
    location /analytics/ {
        proxy_pass http://analytics:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Support documents (download center) — force download instead of inline preview
    location /docs/ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
