server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planirovanie}
    username: ${DB_USER:planirovanie}
    password: ${DB_PASSWORD:planirovanie}
  flyway:
    # Flyway owns the schema (src/main/resources/db/migration). Runs on startup before JPA.
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Schema is managed by Flyway migrations, not Hibernate.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

app:
  auth:
    # Server-side authentication: reads need any signed-in user; writes need EDITOR/ADMIN.
    enabled: ${AUTH_ENABLED:true}
    # Bearer-token session lifetime, hours.
    session-hours: ${AUTH_SESSION_HOURS:12}
    # DEMO ONLY: seed weak demo users (admin/editor/viewer). Off by default (secure).
    seed-defaults: ${AUTH_SEED_DEFAULTS:false}
    # On a fresh DB (demo seeding off) a single "admin" is created with this password;
    # if blank, a strong random password is generated and printed once in the startup log.
    admin-password: ${APP_ADMIN_PASSWORD:}
    # Login brute-force lockout: after N failures per (user|ip), block for M seconds.
    max-attempts: ${AUTH_MAX_ATTEMPTS:8}
    lockout-seconds: ${AUTH_LOCKOUT_SECONDS:300}
  # CORS allow-list for /api/** (comma-separated). Restrict to your web origin(s) in production.
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:*}
  # Allowed Origin patterns for the /ws/board collaboration socket (comma-separated).
  ws:
    allowed-origins: ${APP_WS_ALLOWED_ORIGINS:*}
  audit:
    # Event/audit logging into a SEPARATE PostgreSQL database. If that DB is unreachable,
    # logging self-disables and the app keeps running. Create it once: CREATE DATABASE planirovanie_audit;
    enabled: ${AUDIT_ENABLED:true}
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/planirovanie_audit}
    username: ${AUDIT_DB_USER:${DB_USER:planirovanie}}
    password: ${AUDIT_DB_PASSWORD:${DB_PASSWORD:planirovanie}}
  integrations:
    # Optional outbound integrations. Left empty by default (feature stays off until configured).
    slack:
      webhook: ${SLACK_WEBHOOK_URL:}     # Incoming Webhook URL (simplest), or use token+channel below
      token:   ${SLACK_BOT_TOKEN:}       # xoxb-… bot token (chat.postMessage)
      channel: ${SLACK_CHANNEL:}         # #channel or channel id (when using a bot token)
    # ---- Atlassian product suite (all Cloud REST; off until configured) ----
    jira:
      base:      ${JIRA_BASE_URL:}       # https://your-domain.atlassian.net
      email:     ${JIRA_EMAIL:}          # Atlassian account e-mail (shared by Jira/JSM/JPD/Confluence/Compass)
      token:     ${JIRA_API_TOKEN:}      # Atlassian API token (Basic auth)
      project:   ${JIRA_PROJECT_KEY:}    # e.g. PLAN
      issueType: ${JIRA_ISSUE_TYPE:Task}
    jsm:                                 # Jira Service Management
      serviceDeskId: ${JSM_SERVICE_DESK_ID:}
      requestTypeId: ${JSM_REQUEST_TYPE_ID:}
    jpd:                                 # Jira Product Discovery
      project:   ${JPD_PROJECT_KEY:}
    confluence:
      base:      ${CONFLUENCE_BASE_URL:${JIRA_BASE_URL:}}   # defaults to the Jira/Atlassian base
      space:     ${CONFLUENCE_SPACE_KEY:}
    compass:
      cloudId:   ${COMPASS_CLOUD_ID:}
    bitbucket:
      workspace:   ${BITBUCKET_WORKSPACE:}
      user:        ${BITBUCKET_USER:}
      appPassword: ${BITBUCKET_APP_PASSWORD:}
      repo:        ${BITBUCKET_REPO:}
    trello:
      key:   ${TRELLO_API_KEY:}
      token: ${TRELLO_TOKEN:}
      list:  ${TRELLO_LIST_ID:}
    opsgenie:
      apiKey: ${OPSGENIE_API_KEY:}
    statuspage:
      apiKey: ${STATUSPAGE_API_KEY:}
      pageId: ${STATUSPAGE_PAGE_ID:}
    bamboo:
      base:  ${BAMBOO_BASE_URL:}
      token: ${BAMBOO_TOKEN:}
      plan:  ${BAMBOO_PLAN_KEY:}
