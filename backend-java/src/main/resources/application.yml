server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planirovanie}
    username: ${DB_USER:planirovanie}
    password: ${DB_PASSWORD:planirovanie}
  flyway:
    # Flyway owns the schema (src/main/resources/db/migration). Runs on startup before JPA.
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Schema is managed by Flyway migrations, not Hibernate.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

app:
  auth:
    # Server-side authentication: reads need any signed-in user; writes need EDITOR/ADMIN.
    enabled: ${AUTH_ENABLED:true}
    # Bearer-token session lifetime, hours.
    session-hours: ${AUTH_SESSION_HOURS:12}
    # Seed demo users (admin/editor/viewer) on first startup; turn off for real deployments.
    seed-defaults: ${AUTH_SEED_DEFAULTS:true}
  audit:
    # Event/audit logging into a SEPARATE PostgreSQL database. If that DB is unreachable,
    # logging self-disables and the app keeps running. Create it once: CREATE DATABASE planirovanie_audit;
    enabled: ${AUDIT_ENABLED:true}
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/planirovanie_audit}
    username: ${AUDIT_DB_USER:${DB_USER:planirovanie}}
    password: ${AUDIT_DB_PASSWORD:${DB_PASSWORD:planirovanie}}
  integrations:
    # Optional outbound integrations. Left empty by default (feature stays off until configured).
    slack:
      webhook: ${SLACK_WEBHOOK_URL:}     # Incoming Webhook URL (simplest), or use token+channel below
      token:   ${SLACK_BOT_TOKEN:}       # xoxb-… bot token (chat.postMessage)
      channel: ${SLACK_CHANNEL:}         # #channel or channel id (when using a bot token)
    jira:
      base:      ${JIRA_BASE_URL:}       # https://your-domain.atlassian.net
      email:     ${JIRA_EMAIL:}          # Atlassian account e-mail
      token:     ${JIRA_API_TOKEN:}      # Atlassian API token (Basic auth)
      project:   ${JIRA_PROJECT_KEY:}    # e.g. PLAN
      issueType: ${JIRA_ISSUE_TYPE:Task}
